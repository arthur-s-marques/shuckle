<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <title>SHUCKLE REFLEX - Jogo de Reflexo</title>
    <style>
        
    .btn-header {
    background: #e63946;
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    box-shadow: 0 4px 0 #b31e29;
    cursor: pointer;
    border: 2px solid white;
    transition: 0.1s;
}
        /* Área do jogo */
        .game-area {
            background: #f9e7cf;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.1);
            border-bottom: 8px solid #e0c9a6;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
            border:4px solid #e63946;
        }

        .game-area.waiting {
            background: #ffe0b2;
        }

        .game-area.ready {
            background: #c8e6c9;
            animation: pulse 1s infinite;
        }

        .game-area.wrong {
            background: #ffcdd2;
            animation: shake 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .phase-indicator {
            font-size: 1.2em;
            font-weight: bold;
            color: #c49b6c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stars {
            display: flex;
            gap: 3px;
        }

        .star {
            font-size: 1.4em;
            transition: all 0.3s;
        }

        .star.earned {
            animation: starPop 0.5s ease;
        }

        @keyframes starPop {
            0% { transform: scale(0); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .target-button {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 6px solid white;
            font-size: 3em;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }

        .target-button:active {
            transform: scale(0.9);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .target-button.hidden {
            opacity: 0;
            transform: scale(0.3);
            pointer-events: none;
        }

        .target-button.visible {
            opacity: 1;
            transform: scale(1);
            animation: popIn 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .message {
            font-size: 1.1em;
            font-weight: bold;
            color: #795548;
            margin-top: 15px;
            min-height: 30px;
            transition: all 0.3s;
        }

        .score-display {
            font-size: 1em;
            color: #8d6e63;
            margin-top: 8px;
            font-weight: 600;
        }

        .btn-start {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255,107,107,0.4);
            transition: all 0.2s;
            letter-spacing: 1px;
            z-index: 3;
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(255,107,107,0.4);
        }

        .results {
            text-align: center;
            padding: 10px;
        }

        .results h3 {
            color: #ff6b6b;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .result-time {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(45deg, #ffb347, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-detail {
            font-size: 0.9em;
            color: #8d6e63;
            margin: 5px 0;
        }

        .btn-replay {
            background: linear-gradient(45deg, #66bb6a, #81c784);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102,187,106,0.4);
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-replay:active {
            transform: scale(0.95);
        }

        .btn-restart {
            background: linear-gradient(45deg, #ffb347, #ffcc02);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,179,71,0.3);
            margin-left: 10px;
            transition: all 0.2s;
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 12px;
            }
            .target-button {
                width: 100px;
                height: 100px;
                font-size: 2.2em;
                border-width: 4px;
            }
            .game-title {
                font-size: 1.4em;
            }
            .btn-header {
                width: 36px;
                height: 36px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
  <source src="../musicas/audio.mp3" type="audio/mpeg">
</audio>
    <div class="main-panel">
    <div class="header">
        <div class="logo-placeholder"></div>
        <div class="shuckle-title">
            <span class="s-letter">S</span>
            <span class="h-letter">H</span>
            <span class="u-letter">U</span>
            <span class="c-letter">C</span>
            <span class="k-letter">K</span>
            <span class="l-letter">L</span>
            <span class="e-letter">E</span>
        </div>
        <div class="header-buttons">
           <button class="btn-header" id="btnBack" title="Voltar" onclick="voltarParaHome()">
                <img src="../img/voltar.png" alt="Voltar" class="header-icon">
            </button>
            <button class="btn-header" id="btnSettings" onclick="irConfiguracoes()" style="background:#e63946; box-shadow: 0 4px 0 #b31e29;" title="Configurações">
                <img src="../img/configuracoes.png" alt="Configurações" class="header-icon">
        </div>
    </div>
    

        <!-- Área do Jogo -->
        <div class="game-area" id="gameArea">
            <div class="phase-indicator" id="phaseIndicator">
                Fase <span id="phaseNumber">1</span>/3
                <span class="stars" id="starsDisplay">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </span>
            </div>
            
            <button class="target-button hidden" id="targetButton">
                🎯
            </button>
            
            <div class="message" id="message">Toque em "COMEÇAR" para jogar!</div>
            <div class="score-display" id="scoreDisplay"></div>
            
            <button class="btn-start" id="btnStart" style="display: block;">🚀 COMEÇAR</button>
            <div id="resultsContainer" style="display: none;"></div>
        </div>
    </div>

    <script src="../js/global.js"></script>
    <script src="../audio.js"></script>
    <script>
function voltarParaHome() {
    window.location.href = '../assets/index.html';
}

    function irConfiguracoes() {
    window.location.href = '../assets/configuracoes.html';
}

(function() {
    // Estado do jogo
    const PHASES = [
        { id: 1, name: 'Fácil', trials: 3, minDelay: 1200, maxDelay: 3500, color: '#ff6b6b' },
        { id: 2, name: 'Mediano', trials: 4, minDelay: 750, maxDelay: 2500, color: '#66bb6a' },
        { id: 3, name: 'Pense rápido!', trials: 5, minDelay: 350, maxDelay: 2000, color: '#ab47bc' },
    ];

    let currentPhase = 0;
    let currentTrial = 0;
    let reactionTimes = [];
    let allReactionTimes = [];
    let waitingForClick = false;
    let targetVisible = false;
    let targetAppearTime = 0;
    let timeoutId = null;
    let gameStarted = false;
    let gameFinished = false;
    let canClick = false;
    let preparingPhase = true;

    // Elementos
    const gameArea = document.getElementById('gameArea');
    const targetButton = document.getElementById('targetButton');
    const messageEl = document.getElementById('message');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const btnStart = document.getElementById('btnStart');
    const phaseNumber = document.getElementById('phaseNumber');
    const starsDisplay = document.getElementById('starsDisplay');
    const resultsContainer = document.getElementById('resultsContainer');

    function getRandomDelay(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function resetGame() {
        currentPhase = 0;
        currentTrial = 0;
        reactionTimes = [];
        allReactionTimes = [];
        waitingForClick = false;
        targetVisible = false;
        gameStarted = false;
        gameFinished = false;
        canClick = false;
        preparingPhase = true;
        
        if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
        }

        targetButton.classList.add('hidden');
        targetButton.classList.remove('visible');
        gameArea.classList.remove('waiting', 'ready', 'wrong');
        btnStart.style.display = 'block';
        resultsContainer.style.display = 'none';
        resultsContainer.innerHTML = '';
        messageEl.textContent = 'Toque em "COMEÇAR" para jogar!';
        scoreDisplay.textContent = '';
        phaseNumber.textContent = '1';
        updateStars(0);
    }

    function updateStars(earned) {
        const stars = starsDisplay.querySelectorAll('.star');
        stars.forEach((star, index) => {
            if (index < earned) {
                star.textContent = '⭐';
                star.classList.add('earned');
            } else {
                star.textContent = '☆';
                star.classList.remove('earned');
            }
        });
    }

    function startGame() {
        resetGame();
        gameStarted = true;
        currentPhase = 0;
        btnStart.style.display = 'none';
        resultsContainer.style.display = 'none';
        startPhase();
    }

    function startPhase() {
        if (currentPhase >= PHASES.length) {
            endGame();
            return;
        }

        const phase = PHASES[currentPhase];
        currentTrial = 0;
        reactionTimes = [];
        preparingPhase = true;
        canClick = false;
        
        phaseNumber.textContent = phase.id;
        updateStars(0);
        targetButton.style.background = phase.color;
        targetButton.style.boxShadow = `0 10px 25px ${phase.color}55`;
        
        messageEl.textContent = `Fase ${phase.id}: ${phase.name} - Preparado?`;
        scoreDisplay.textContent = `${phase.trials} tentativas`;
        gameArea.classList.remove('wrong', 'ready');
        gameArea.classList.add('waiting');
        
        targetButton.classList.add('hidden');
        targetButton.classList.remove('visible');
        
        setTimeout(() => {
            preparingPhase = false;
            scheduleTarget();
        }, 1500);
    }

    function scheduleTarget() {
        const phase = PHASES[currentPhase];
        
        if (currentTrial >= phase.trials) {
            finishPhase();
            return;
        }

        waitingForClick = false;
        targetVisible = false;
        canClick = true; // Permitir cliques para detectar penalidade
        targetButton.classList.add('hidden');
        targetButton.classList.remove('visible');
        gameArea.classList.remove('ready', 'wrong');
        gameArea.classList.add('waiting');
        
        messageEl.textContent = `Aguarde o botão aparecer... (${currentTrial + 1}/${phase.trials})`;
        
        const delay = getRandomDelay(phase.minDelay, phase.maxDelay);
        
        timeoutId = setTimeout(() => {
            showTarget();
        }, delay);
    }

    function showTarget() {
        targetVisible = true;
        targetAppearTime = performance.now();
        
        targetButton.classList.remove('hidden');
        targetButton.classList.add('visible');
        gameArea.classList.remove('waiting', 'wrong');
        gameArea.classList.add('ready');
        
        messageEl.textContent = 'TOQUE AGORA! 🎯';
        waitingForClick = true;
    }

    function handleTargetClick(e) {
        e.preventDefault();
        e.stopPropagation();
        
        if (!gameStarted || gameFinished) return;
        if (preparingPhase) return;
        if (!canClick) return;
        
        // Se o botão está visível - ACERTO!
        if (targetVisible && waitingForClick) {
            const reactionTime = performance.now() - targetAppearTime;
            reactionTimes.push(reactionTime);
            allReactionTimes.push(reactionTime);
            
            targetVisible = false;
            waitingForClick = false;
            canClick = false;
            
            gameArea.classList.remove('ready', 'wrong');
            targetButton.classList.add('hidden');
            targetButton.classList.remove('visible');
            
            messageEl.textContent = `⏱️ ${Math.round(reactionTime)} ms - Muito bem!`;
            scoreDisplay.textContent = `Tentativa ${currentTrial + 1}/${PHASES[currentPhase].trials}`;
            
            let stars = 0;
            if (reactionTime < 400) stars = 3;
            else if (reactionTime < 700) stars = 2;
            else if (reactionTime < 1000) stars = 1;
            else stars = 0;
            
            updateStars(stars);
            
            currentTrial++;
            
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            
            setTimeout(() => {
                if (currentPhase < PHASES.length && currentTrial < PHASES[currentPhase].trials) {
                    scheduleTarget();
                } else if (currentTrial >= PHASES[currentPhase].trials) {
                    finishPhase();
                }
            }, 800);
        }
    }

    function handleAreaClick(e) {
        // Só processa cliques na área, não no botão
        if (e.target === targetButton || targetButton.contains(e.target)) {
            return; // Ignora cliques no botão
        }
        
        if (!gameStarted || gameFinished) return;
        if (preparingPhase) return;
        if (!canClick) return;
        
        // Se clicou na área mas o botão não está visível - PENALIDADE!
        if (!targetVisible) {
            handleEarlyClick();
        }
    }

    function handleEarlyClick() {
        if (!gameStarted || gameFinished) return;
        
        canClick = false;
        gameArea.classList.add('wrong');
        messageEl.textContent = '❌ Ops! Muito cedo! Espere o sinal!';
        scoreDisplay.textContent = 'Penalidade: +2000ms';
        
        if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
        }
        
        waitingForClick = false;
        targetVisible = false;
        targetButton.classList.add('hidden');
        targetButton.classList.remove('visible');
        
        reactionTimes.push(2000);
        allReactionTimes.push(2000);
        updateStars(0);
        
        currentTrial++;
        
        setTimeout(() => {
            gameArea.classList.remove('wrong');
            if (currentPhase < PHASES.length && currentTrial < PHASES[currentPhase].trials) {
                scheduleTarget();
            } else if (currentTrial >= PHASES[currentPhase].trials) {
                finishPhase();
            }
        }, 1500);
    }

    function finishPhase() {
        const phase = PHASES[currentPhase];
        const avg = reactionTimes.length > 0 
            ? Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) 
            : 0;
        
        messageEl.textContent = `Fase ${phase.id} completa! Média: ${avg} ms`;
        scoreDisplay.textContent = 'Preparando próxima fase...';
        updateStars(0);
        canClick = false;
        
        currentPhase++;
        preparingPhase = true;
        
        setTimeout(() => {
            if (currentPhase < PHASES.length) {
                startPhase();
            } else {
                endGame();
            }
        }, 2000);
    }

    function endGame() {
        gameFinished = true;
        canClick = false;
        preparingPhase = false;
        targetButton.classList.add('hidden');
        targetButton.classList.remove('visible');
        gameArea.classList.remove('waiting', 'ready', 'wrong');
        btnStart.style.display = 'none';
        
        const validTimes = allReactionTimes.filter(t => t < 2000);
        const avgTime = validTimes.length > 0 
            ? Math.round(validTimes.reduce((a, b) => a + b, 0) / validTimes.length) 
            : 0;
        
        const fastest = validTimes.length > 0 ? Math.min(...validTimes) : 0;
        const slowest = validTimes.length > 0 ? Math.max(...validTimes) : 0;
        const penalties = allReactionTimes.filter(t => t >= 2000).length;
        
        let rating = '';
        let emoji = '';
        if (avgTime < 350) { rating = 'Incrível!'; emoji = '🏆'; }
        else if (avgTime < 500) { rating = 'Excelente!'; emoji = '🌟'; }
        else if (avgTime < 700) { rating = 'Muito Bom!'; emoji = '👏'; }
        else if (avgTime < 900) { rating = 'Bom!'; emoji = '👍'; }
        else { rating = 'Continue Treinando!'; emoji = '💪'; }
        
        resultsContainer.style.display = 'block';
        resultsContainer.innerHTML = `
            <div class="results">
                <h3>${emoji} ${rating}</h3>
                <div class="result-time">${avgTime} ms</div>
                <div class="result-detail">Tempo médio de reação</div>
                <div class="result-detail" style="margin-top: 10px;">
                    ⚡ Mais rápido: ${fastest} ms<br>
                    🐢 Mais lento: ${slowest} ms<br>
                    ${penalties > 0 ? `⚠️ Penalidades: ${penalties} clique(s) antecipado(s)<br>` : ''}
                    🎯 Precisão: ${validTimes.length}/${allReactionTimes.length}
                </div>
                <button class="btn-replay" onclick="window._shuckleReplay()">🔄 JOGAR NOVAMENTE</button>
            </div>
        `;
        
        messageEl.textContent = 'Parabéns! 🎉';
        scoreDisplay.textContent = '';
        phaseNumber.textContent = '✓';
        updateStars(0);
    }

    // Event Listeners
    targetButton.addEventListener('pointerdown', handleTargetClick);
    targetButton.addEventListener('click', (e) => e.preventDefault());
    
    // Listener na área do jogo para detectar cliques fora do botão
    gameArea.addEventListener('click', handleAreaClick);
    
    document.getElementById('btnStart').addEventListener('click', startGame);
    
    document.getElementById('btnBack').addEventListener('click', () => {
        if (timeoutId) clearTimeout(timeoutId);
        resetGame();
        voltarParaHome();
    });
    

    window._shuckleReplay = function() {
        resetGame();
        startGame();
    };

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
})();

const music = document.getElementById('bgMusic');

function startMusic() {

    if (!somEstaAtivo()) {
        return;
    }

    music.volume = volumeMusica();

    music.play()

        .then(() => {
            document.removeEventListener('click', startMusic);
            document.removeEventListener('touchstart', startMusic);
            document.removeEventListener('keydown', startMusic);
        })

        .catch(err => {
            console.warn('Não foi possível tocar o áudio:', err);
        });
}

document.addEventListener('click', startMusic);
document.addEventListener('touchstart', startMusic);
document.addEventListener('keydown', startMusic);
    </script>
</body>
</html>
